name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (the API test reads the generated dataset)
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: pnpm build
      - run: pnpm test
      - name: Validate committed data (no network)
        run: pnpm validate --no-strict
